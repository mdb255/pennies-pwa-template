name: Deploy Backend to AWS Lambda

on:
  push:
    branches: [ main ]
    paths: [ 'back-end/**' ]
  workflow_dispatch:

env:
  AWS_REGION: <{{ aws_region }}>
  ECR_REPOSITORY: <{{ app_name }}>-api
  ROLE_ARN: arn:aws:iam::<{{ aws_account_id }}>:role/<{{ app_name_snake }}>_deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # <-- required for OIDC

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: gha-deploy

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '<{{ python_version }}>'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Install dependencies
      working-directory: back-end/<{{ app_name }}>-api
      run: uv sync --frozen --no-dev

    # --- Build-time secrets (for CI steps like Alembic) ---
    # Pull from SSM Parameter Store (SecureString recommended)
    - name: Load build-time parameters from SSM
      id: ssm
      run: |
        SSM_PREFIX="/<{{ app_name }}>/prod"
        PARAMS=(
          "MIGRATIONS_DB_URL"
          "RUNTIME_DB_URL"
          "USER_POOL_ID"
          "APP_CLIENT_ID"
          "LAMBDA_FUNCTION_NAME"
        )
        
        for param in "${PARAMS[@]}"; do
          value=$(aws ssm get-parameter \
            --name "${SSM_PREFIX}/${param}" \
            --with-decryption \
            --query 'Parameter.Value' --output text)
          echo "${param}=${value}" >> "$GITHUB_ENV"
        done

    - name: Run database migrations
      working-directory: back-end/<{{ app_name }}>-api
      env:
        MIGRATIONS_DB_URL: ${{ env.MIGRATIONS_DB_URL }}
      run: uv run alembic upgrade head

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to Amazon ECR
      working-directory: back-end/<{{ app_name }}>-api
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker buildx build --platform linux/amd64 \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --push .
        docker buildx build --platform linux/amd64 \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest --push .

    # --- Deploy the new image to the Lambda function ---
    # The function and its runtime env vars are provisioned by Terraform; here we only
    # point the existing function at the freshly pushed image and wait for it to settle.
    - name: Deploy image to Lambda
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        aws lambda update-function-code \
          --function-name "${LAMBDA_FUNCTION_NAME}" \
          --image-uri "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        aws lambda wait function-updated --function-name "${LAMBDA_FUNCTION_NAME}"
