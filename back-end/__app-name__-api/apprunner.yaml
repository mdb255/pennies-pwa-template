version: 1.0
runtime: python3
build:
  commands:
    build:
      - echo "Building FastAPI application"
      - echo "Dependencies installed via Dockerfile"
run:
  runtime-version: <{{ python_version }}>
  command: uv run uvicorn app.main:app --host 0.0.0.0 --port <{{ api_port }}> --app-dir src
  network:
    port: <{{ api_port }}>
    env: PORT
  env:
    - name: APP_ENV
      value: production
