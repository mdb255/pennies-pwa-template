version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: <{{ app_name_snake }}>_db
    ports:
      - "<{{ dev_db_port }}>:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d <{{ app_name_snake }}>_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - dbdata:/var/lib/postgresql/data
  adminer:
    image: adminer
    ports:
      - "<{{ dev_adminer_port }}>:8080"
    depends_on:
      - db
volumes:
  dbdata:
