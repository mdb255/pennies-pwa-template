[project]
name = "<{{ app_name }}>"
version = "0.1.0"
description = "<{{ app_name }}> API"
requires-python = ">=<{{ python_version }}>"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "alembic>=1.13",
  "boto3>=1.34",
  "python-jose[cryptography]>=3.3",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
  "pyright>=1.1",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "<{{ python_version }}>"
typeCheckMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
